<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found | Cocoblitz</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0a09;
        --panel: #17120f;
        --text: #f5f5f4;
        --muted: #d6d3d1;
        --accent: #4ade80;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(74, 222, 128, 0.12), transparent 30%), var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(92vw, 560px);
        background: rgba(23, 18, 15, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 2.5rem;
        text-align: center;
      }

      .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.25rem;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(2.4rem, 6vw, 4rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.8rem 1.25rem;
        border-radius: 999px;
        background: var(--accent);
        color: #111827;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">404</div>
      <h1>Page not found</h1>
      <p>The page you requested could not be found. Return to Cocoblitz to explore our premium coconut products and sourcing story.</p>
      <a href="/">Back to homepage</a>
    </main>
  </body>
</html>
